name: Monitor de Señales NovaPlay

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Clonar historial completo para evitar errores de push

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar Verificación
        env:
          JSON_SOURCE_URL: ${{ secrets.JSON_SOURCE_URL }}
          TOKEN_API_URL: ${{ secrets.TOKEN_API_URL }}
        run: python verify.py

      - name: Publicar Resultados
        run: |
          git config --global user.name "NovaPlay Monitor"
          git config --global user.email "monitor@novaplay.tv"
          git pull origin main --rebase # Asegurar que no borramos cambios manuales hechos desde la web
          git add status.json manual_overrides.json
          git commit -m "System: Actualización automática de señales [$(date '+%Y-%m-%d %H:%M')]" || exit 0
          git push origin main
