<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novaplay | Verificador de Señal</title>
    <link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #e50914;
            --bg: #080a10;
            --card-bg: #11151f;
            --text: #ffffff;
            --success: #10b981;
            --error: #ef4444;
            --warning: #ffbb00;
            --border: rgba(255,255,255,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding-top: 80px; min-height: 100vh; display: flex; flex-direction: column; }

        .nova-nav { position: fixed; top: 0; width: 100%; z-index: 10000; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); transition: 0.3s; }
        .nav-inner { max-width: 1400px; margin: auto; height: 70px; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 18px; color: #fff; text-decoration: none; z-index: 10001; }
        .brand img { width: 32px; border-radius: 6px; }

        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-links a { color: #ccc; text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; padding: 10px 15px; border-radius: 10px; }
        .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.05); }

        .nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 10px; flex-direction: column; gap: 5px; z-index: 10001; }
        .nav-toggle span { display: block; width: 25px; height: 3px; background: #fff; transition: 0.3s; border-radius: 2px; }

        .btn-login-nav, .btn-logout { background: var(--primary); color: #fff; font-weight: 800; border: none; cursor: pointer; padding: 8px 18px; border-radius: 10px; font-size: 12px; transition: 0.2s; }
        .btn-login-nav:hover { transform: scale(1.05); }
        .btn-logout { background: #222; }

        /* Dropdown de Administración Premium - FIX DEFINITIVO */
        .admin-menu { position: relative; display: none; align-items: center; padding: 10px 0; margin: -10px 0; }
        .btn-admin { background: #fff; color: #000; font-weight: 900; border: none; cursor: pointer; padding: 10px 20px; border-radius: 12px; font-size: 13px; display: flex; align-items: center; gap: 10px; transition: 0.2s; position: relative; z-index: 10002; }
        .btn-admin:hover { background: var(--primary); color: #fff; box-shadow: 0 0 20px rgba(229,9,20,0.4); }
        .dropdown-content { position: absolute; top: 100%; right: 0; background: var(--card-bg); min-width: 280px; border-radius: 24px; border: 1px solid var(--border); overflow: hidden; display: none; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.8); z-index: 10001; margin-top: 5px; transition: 0.3s; }
        .dropdown-content::before { content: ""; position: absolute; top: -30px; left: 0; right: 0; height: 40px; background: transparent; }
        .admin-menu:hover .dropdown-content { display: flex; }
        .dropdown-content a { padding: 15px 20px; color: #fff !important; text-decoration: none !important; font-size: 13px !important; font-weight: 700 !important; border-bottom: 1px solid rgba(255,255,255,0.03); transition: 0.2s; display: flex; align-items: center; gap: 12px; }
        .dropdown-content a i { width: 20px; color: var(--primary); text-align: center; }
        .dropdown-content a:hover { background: rgba(255,255,255,0.05); padding-left: 25px; }
        .dropdown-content .logout-link { color: var(--error) !important; border-bottom: none; }
        .dropdown-content .logout-link i { color: var(--error); }

        main { max-width: 1400px; margin: 0 auto; padding: 40px 30px; flex-grow: 1; width: 100%; }
        .header { text-align: center; margin-bottom: 50px; }
        .header h1 { font-size: clamp(32px, 5vw, 42px); font-weight: 900; letter-spacing: -1.5px; margin-bottom: 10px; }
        .update-tag { display: inline-block; padding: 6px 15px; background: rgba(255,255,255,0.05); border-radius: 30px; font-size: 12px; font-weight: 700; color: #aaa; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 25px; transition: 0.3s; position: relative; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); }

        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .ONLINE .status-dot, .PROTECTED .status-dot, .MANUAL_ONLINE .status-dot { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .OFFLINE .status-dot, .ERROR .status-dot { background: var(--error); }

        .channel-name { font-size: 18px; font-weight: 800; margin-bottom: 5px; }
        .category-tag { font-size: 10px; font-weight: 900; text-transform: uppercase; opacity: 0.4; letter-spacing: 1px; }
        .latency { font-size: 11px; font-weight: 700; color: #888; margin-top: 15px; display: flex; align-items: center; justify-content: space-between; }

        .btn-manual { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; font-size: 9px; font-weight: 800; padding: 4px 8px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-manual:hover { background: var(--primary); border-color: var(--primary); }

        /* Login */
        #auth-view { position: fixed; inset: 0; background: var(--bg); z-index: 10001; display: none; justify-content: center; align-items: center; }
        .auth-card { width: 400px; padding: 50px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 35px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.6); position: relative; }
        .auth-card input { width: 100%; padding: 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; color: #fff; margin-bottom: 15px; font-size: 15px; }
        .status { margin-top: 15px; padding: 14px; border-radius: 12px; font-size: 13px; font-weight: 800; display: none; text-align: center; }
        .status.error { background: rgba(239,68,68,0.1); color: var(--error); border: 1px solid var(--error); }
        .form-group-auth { text-align: left; margin-bottom: 20px; }
        .form-group-auth label { display: block; margin-bottom: 8px; font-size: 11px; font-weight: 900; color: #aaa; text-transform: uppercase; }

        /* NovaModal Premium */
        .nova-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 20000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .nova-modal { position: relative; background: var(--card-bg); border: 1px solid var(--border); border-radius: 30px; width: 100%; max-width: 450px; padding: 40px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); text-align: center; animation: modal-in 0.3s ease-out; }
        .modal-close { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; transition: 0.2s; z-index: 10; }
        .modal-close:hover { color: var(--primary); transform: scale(1.1); }
        @keyframes modal-in { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .nova-modal h3 { font-size: 22px; font-weight: 900; margin-bottom: 15px; text-transform: uppercase; }
        .nova-modal p { color: var(--text-muted); font-size: 15px; margin-bottom: 25px; line-height: 1.5; }
        .nova-modal-btns { display: flex; gap: 12px; }
        .nova-modal-btn { flex: 1; padding: 15px; border-radius: 14px; border: 0; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-confirm { background: var(--primary); color: #fff; }
        .btn-cancel { background: #222; color: #fff; }
        .nova-modal-btn:hover { transform: scale(1.03); }

        footer { padding: 60px 20px; background: #000; border-top: 1px solid rgba(255,255,255,0.05); text-align: center; width: 100%; margin-top: auto; }
        .footer-text { font-size: 13px; color: #444; line-height: 1.8; font-weight: 600; }

        /* Responsividad Mejorada */
        @media (max-width: 900px) {
            html, body { height: auto !important; overflow-y: auto !important; }
            .nav-inner { padding: 0 15px; }
            .nav-toggle { display: flex; }

            .nav-links {
                position: fixed; top: 0; right: -100%; width: 100%; height: 100vh;
                background: rgba(8, 10, 16, 0.98); backdrop-filter: blur(20px);
                flex-direction: column; justify-content: flex-start; align-items: center;
                transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); gap: 15px; padding: 100px 40px 40px;
                overflow-y: auto;
            }
            .nav-links.active { right: 0; }
            .nav-links a { font-size: 18px; width: 100%; text-align: center; padding: 15px; border-radius: 15px; }

            /* Ajuste del botón PANEL en móvil */
            .admin-menu { width: 100%; height: auto; justify-content: center; padding: 0; flex-direction: column; }
            .admin-menu.active .dropdown-content { opacity: 1; visibility: visible; display: flex; }
            .btn-admin { width: 100%; justify-content: center; padding: 18px; font-size: 16px; border-radius: 15px; }
            .dropdown-content { position: relative; width: 100%; top: 0; margin-top: 10px; opacity: 0; visibility: hidden; display: none; transform: none; box-shadow: none; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); }
            .dropdown-content a { padding: 15px; font-size: 14px !important; }

            .nav-toggle.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
            .nav-toggle.active span:nth-child(2) { opacity: 0; }
            .nav-toggle.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

            main { padding: 20px 15px; }
            .grid { grid-template-columns: 1fr; }
            .auth-card { width: 95%; padding: 30px 20px; border-radius: 25px; }

            footer { padding: 40px 15px; }
            .footer-text { font-size: 11px; }
        }

        .hidden { display: none !important; }
    </style>
    </style>
</head>
<body>

<nav class="nova-nav">
    <div class="nav-inner">
        <a href="https://novaplaytv.github.io/Dashboard/" class="brand">
            <img src="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp">
            Novaplay | Verificador
        </a>

        <button class="nav-toggle" id="navToggle" aria-label="Abrir menú">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="nav-links" id="navLinks">
            <a href="https://novaplaytv.github.io/" style="color: var(--primary); font-weight: 800;">INICIO</a>
            <button class="btn-login-nav" id="btnLogin" onclick="mostrarLogin()">INGRESAR</button>
            <div class="admin-menu" id="adminMenu">
                <button class="btn-admin"><i class="fas fa-user-shield"></i> PANEL</button>
                <div class="dropdown-content">
                    <a href="https://novaplaytv.github.io/Dashboard/"><i class="fas fa-chart-line"></i> Dashboard Central</a>
                    <a href="https://novaplaytv.github.io/panel-canales/"><i class="fas fa-tv"></i> Admin. Canales</a>
                    <a href="https://novaplaytv.github.io/NovaSecurity/"><i class="fas fa-shield-alt"></i> NovaSecurity</a>
                    <a href="https://novaplaytv.github.io/SignalVerificador/"><i class="fas fa-broadcast-tower"></i> Verificador de Señal</a>
                    <a href="https://novaplaytv.github.io/novaimg/actualizar-icono/"><i class="fas fa-icons"></i> Gestión de Iconos</a>
                    <a href="https://novaplaytv.github.io/novaimg/generador/"><i class="fas fa-magic"></i> Icon Studio</a>
                    <a href="#" onclick="cerrarSesion(); return false;" class="logout-link"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<footer>
    <div class="footer-text">
        © 2026 NOVAPLAY TV<br>
        © 2010 - 2026 - MSGT. TODOS LOS DERECHOS RESERVADOS
    </div>
</footer>

<div class="nova-modal-overlay" id="novaModal">
    <div class="nova-modal">
        <h3 id="novaModalTitle" style="font-weight:900;">Confirmar</h3>
        <p id="novaModalMessage" style="color: var(--text-muted); margin-bottom: 25px; line-height: 1.5;"></p>
        <div id="modalInputContainer" class="hidden">
            <input type="text" id="modalInput" placeholder="...">
            <select id="modalSelect" class="hidden"></select>
        </div>
        <div class="nova-modal-btns">
            <button class="nova-modal-btn btn-cancel" id="novaModalCancel">CANCELAR</button>
            <button class="nova-modal-btn btn-confirm" id="novaModalConfirm">ACEPTAR</button>
        </div>
    </div>
</div>

<div id="auth-view">
    <div class="auth-card">
        <button class="modal-close" onclick="document.getElementById('auth-view').style.display='none'"><i class="fas fa-times"></i></button>
        <h2 style="margin-bottom:30px; font-weight:900; font-size: 28px;">Acceso al Panel</h2>
        <div class="form-group-auth">
            <label>Usuario</label>
            <input type="text" id="username" placeholder="Usuario Staff">
        </div>
        <div class="form-group-auth">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="btn-login-nav" style="width:100%; justify-content:center; padding: 18px; border-radius: 14px; font-weight: 900;" onclick="iniciarSesion()">ENTRAR AL VERIFICADOR</button>
        <div id="loginStatus" class="status"></div>
    </div>
</div>

<main>
    <div class="header">
        <h1>Búnker de Monitoreo</h1>
        <div class="update-tag" id="lastUpdate">Sincronizando estado...</div>
    </div>
    <div class="grid" id="mainGrid"></div>
</main>

<script>
    const API_URL = "https://mrghnngupolsgatcmevw.supabase.co/functions/v1/actualizar-canales";
    let sessionToken = localStorage.getItem("novaplay_session_token") || "";
    let allSignals = [];

    async function req(body) {
        const h = { "Content-Type": "application/json" };
        if (sessionToken) h.Authorization = "Bearer " + sessionToken;
        const r = await fetch(API_URL, { method: "POST", headers: h, body: JSON.stringify(body) });
        return r.json();
    }

    function openModal(title, msg, onConfirm) {
        const m = document.getElementById("novaModal");
        document.getElementById("modalTitle").innerText = title;
        document.getElementById("modalMessage").innerText = msg;
        m.style.display = "flex";
        document.getElementById("modalCancel").onclick = () => m.style.display = "none";
        document.getElementById("modalConfirm").onclick = () => { onConfirm(); m.style.display = "none"; };
    }

    async function loadData() {
        try {
            const res = await fetch('status.json?t=' + Date.now()).then(r => r.json());
            allSignals = res.results;
            const lastUpdateEl = document.getElementById('lastUpdate');
            if(lastUpdateEl) lastUpdateEl.innerText = "Última Verificación: " + res.last_update;
            render();
        } catch (e) {
            const gridEl = document.getElementById('mainGrid');
            if(gridEl) gridEl.innerHTML = "<p style='text-align:center; width:100%; opacity:0.5;'>Iniciando primer reporte...</p>";
        }
    }

    function render() {
        const grid = document.getElementById('mainGrid');
        const isAdmin = sessionToken !== "";

        grid.innerHTML = allSignals.map(s => {
            let statusText = s.status;
            let displayColor = (s.status === 'OFFLINE' || s.status === 'ERROR') ? 'var(--error)' : 'var(--success)';

            if (s.status === 'PROTECTED') {
                statusText = 'ONLINE <small>(Codificado)</small>';
                displayColor = 'var(--success)';
            }
            if (s.status === 'MANUAL_ONLINE') {
                statusText = 'Verificado Manualmente';
                displayColor = 'var(--success)';
            }

            // Caso Especial: NovaSports 404
            if (s.name.toUpperCase().includes("NOVASPORTS") && s.code === 404) {
                statusText = 'OFFLINE <small>(Sin Evento)</small>';
                displayColor = 'var(--error)';
            }

            const showManualBtn = isAdmin && (s.status === 'OFFLINE' || s.status === 'ERROR' || s.status === 'PROTECTED');
            const showResetBtn = isAdmin && s.status === 'MANUAL_ONLINE';

            return `
                <div class="card ${s.status}">
                    <div class="category-tag">${s.category}</div>
                    <div class="channel-name">${s.name}</div>
                    <div style="font-size: 13px; font-weight: 800; color: ${displayColor}">
                        <span class="status-dot"></span>${statusText}
                    </div>
                    <div class="latency">
                        <span><i class="fas fa-bolt"></i> ${s.latency}</span>
                        ${showManualBtn ? `<button class="btn-manual" onclick="setManual('${s.id}', true)">FORZAR ONLINE</button>` : ''}
                        ${showResetBtn ? `<button class="btn-manual" onclick="setManual('${s.id}', false)">QUITAR FORZADO</button>` : ''}
                    </div>
                </div>
            `;
        }).join('');

        document.getElementById('btnLogin').classList.toggle('hidden', isAdmin);
        const adminMenu = document.getElementById('adminMenu');
        if(adminMenu) adminMenu.style.display = isAdmin ? 'flex' : 'none';
    }

    async function setManual(id, status) {
        openModal(
            status ? "Forzar Online" : "Quitar Forzado",
            status ? "¿Marcar este canal como ONLINE manualmente?" : "¿Restablecer verificación automática?",
            async () => {
                const res = await req({
                    action: "seguridad_set_manual_signal",
                    canal_id: id,
                    manual_online: status,
                    repo: "SignalVerificador"
                });

                if (res.success) {
                    location.reload();
                } else {
                    openModal("Error", "Fallo al guardar: " + (res.error || "Acción no permitida"), () => {});
                }
            }
        );
    }

    function mostrarLogin() {
        document.getElementById('auth-view').style.display = 'flex';
    }

    // Toggle Menú Móvil
    const navToggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');
    const adminMenu = document.getElementById('adminMenu');
    const btnAdmin = document.querySelector('.btn-admin');

    if (navToggle) {
        navToggle.addEventListener('click', () => {
            navToggle.classList.toggle('active');
            navLinks.classList.toggle('active');
        });
    }

    // Toggle Dropdown en Móvil
    if (btnAdmin) {
        btnAdmin.addEventListener('click', (e) => {
            if (window.innerWidth <= 900) {
                e.preventDefault();
                adminMenu.classList.toggle('active');
            }
        });
    }

    // Cerrar menú al clickear link (móvil)
    document.querySelectorAll('.nav-links a').forEach(link => {
        link.addEventListener('click', () => {
            if (navToggle) navToggle.classList.remove('active');
            if (navLinks) navLinks.classList.remove('active');
        });
    });

    async function iniciarSesion() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;
        const btn = document.getElementById("btnLogin");
        const loginBtn = document.querySelector("#auth-view .btn-login-nav");
        loginBtn.disabled = true; loginBtn.innerText = "VERIFICANDO...";

        const res = await req({ action: "login", username: u, password: p });
        if (res.token) {
            sessionToken = res.token;
            localStorage.setItem("novaplay_session_token", res.token);
            location.reload();
        } else {
            const el = document.getElementById("loginStatus");
            el.className = "status error";
            el.textContent = "Acceso denegado.";
            el.style.display = "block";
            loginBtn.disabled = false;
            loginBtn.textContent = 'ENTRAR AL VERIFICADOR';
        }
    }

    function cerrarSesion() {
        openModal("Cerrar Sesión", "¿Estás seguro que deseas salir del Verificador?", () => {
            localStorage.removeItem("novaplay_session_token");
            location.reload();
        });
    }

    /* NovaModal Premium */
    function openModal(title, msg, onConfirm, type = "confirm", options = [], defaultValue = "") {
        const m = document.getElementById("novaModal");
        if (!m) return;
        document.getElementById("novaModalTitle").innerText = title;
        document.getElementById("novaModalMessage").innerText = msg;
        const inputContainer = document.getElementById("modalInputContainer");
        const input = document.getElementById("modalInput");
        const select = document.getElementById("modalSelect");

        if (inputContainer) inputContainer.classList.add("hidden");
        if (input) input.classList.add("hidden");
        if (select) select.classList.add("hidden");

        if (type === "prompt") {
            if (inputContainer) inputContainer.classList.remove("hidden");
            if (input) {
                input.classList.remove("hidden");
                input.value = defaultValue;
                setTimeout(() => input.focus(), 100);
            }
        } else if (type === "select") {
            if (inputContainer) inputContainer.classList.remove("hidden");
            if (select) {
                select.classList.remove("hidden");
                select.innerHTML = options.map(o => `<option value="${o.value}">${o.text}</option>`).join('');
                setTimeout(() => select.focus(), 100);
            }
        }

        m.style.display = "flex";

        const close = () => { m.style.display = "none"; };
        document.getElementById("novaModalCancel").onclick = close;
        document.getElementById("novaModalConfirm").onclick = () => {
            if (type === "prompt") onConfirm(input.value);
            else if (type === "select") onConfirm(select.value);
            else onConfirm();
            close();
        };
    }

    loadData();
</script>
</body>
</html>
