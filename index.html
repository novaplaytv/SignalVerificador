<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Señal</title>
    <link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #e50914;
            --bg: #080a10;
            --card-bg: #11151f;
            --text: #ffffff;
            --success: #10b981;
            --error: #ef4444;
            --warning: #ffbb00;
            --border: rgba(255,255,255,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding-top: 80px; }

        .nova-nav { position: fixed; top: 0; width: 100%; z-index: 1000; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); }
        .nav-inner { max-width: 1400px; margin: auto; height: 70px; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 20px; color: #fff; text-decoration: none; }
        .brand img { width: 32px; border-radius: 6px; }

        main { max-width: 1400px; margin: auto; padding: 40px 30px; }

        .header { text-align: center; margin-bottom: 50px; }
        .header h1 { font-size: 42px; font-weight: 900; letter-spacing: -1.5px; margin-bottom: 10px; }
        .update-tag { display: inline-block; padding: 6px 15px; background: rgba(255,255,255,0.05); border-radius: 30px; font-size: 12px; font-weight: 700; color: #aaa; }

        .controls { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .search { flex: 1; min-width: 300px; position: relative; }
        .search input { width: 100%; padding: 15px 20px 15px 45px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; color: #fff; font-size: 15px; }
        .search::before { content: "\f002"; font-family: "Font Awesome 5 Free"; font-weight: 900; position: absolute; left: 18px; top: 50%; transform: translateY(-50%); opacity: 0.4; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 25px; transition: 0.3s; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); }

        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .ONLINE .status-dot, .PROTECTED .status-dot { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .OFFLINE .status-dot { background: var(--error); }
        .REDIRECT .status-dot { background: var(--warning); }

        .channel-name { font-size: 18px; font-weight: 800; margin-bottom: 5px; }
        .category-tag { font-size: 10px; font-weight: 900; text-transform: uppercase; opacity: 0.4; letter-spacing: 1px; }

        .latency { font-size: 11px; font-weight: 700; color: #888; margin-top: 15px; display: flex; align-items: center; gap: 5px; }

        .hidden { display: none; }
    </style>
</head>
<body>

<nav class="nova-nav">
    <div class="nav-inner">
        <a href="https://novaplaytv.github.io/Dashboard/" class="brand">
            <img src="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp">
            Novaplay | Verificador de Señal
        </a>
    </div>
</nav>

<main>
    <div class="header">
        <h1>Búnker de Monitoreo</h1>
        <div class="update-tag" id="lastUpdate">Sincronizando estado...</div>
    </div>

    <div class="controls">
        <div class="search">
            <input type="text" id="searchInput" placeholder="Buscar canal o categoría..." oninput="filter()">
        </div>
    </div>

    <div class="grid" id="mainGrid">
        <!-- Generado dinámicamente -->
    </div>
</main>

<script>
    let allSignals = [];

    async function loadStatus() {
        try {
            const res = await fetch('status.json?t=' + Date.now());
            const data = await res.json();
            allSignals = data.results;
            document.getElementById('lastUpdate').innerText = "Última Verificación: " + data.last_update;
            render(allSignals);
        } catch (e) {
            document.getElementById('mainGrid').innerHTML = "<p style='text-align:center; width:100%; opacity:0.5;'>Esperando a que el bot genere el primer reporte...</p>";
        }
    }

    function render(list) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = list.map(s => `
            <div class="card ${s.status}">
                <div class="category-tag">${s.category}</div>
                <div class="channel-name">${s.name}</div>
                <div class="status-info">
                    <span class="status-dot"></span>
                    <span style="font-size: 13px; font-weight: 800; color: ${s.status === 'OFFLINE' ? 'var(--error)' : 'var(--success)'}">
                        ${s.status === 'PROTECTED' ? 'ONLINE <small>(Codificado)</small>' : s.status} ${s.code !== 200 && s.code !== 0 ? '(HTTP ' + s.code + ')' : ''}
                    </span>
                </div>
                <div class="latency">
                    <i class="fas fa-bolt"></i> Latencia: ${s.latency}
                </div>
            </div>
        `).join('');
    }

    function filter() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allSignals.filter(s =>
            s.name.toLowerCase().includes(query) ||
            s.category.toLowerCase().includes(query)
        );
        render(filtered);
    }

    loadStatus();
    setInterval(loadStatus, 60000); // Auto-refresco cada minuto
</script>

</body>
</html>
